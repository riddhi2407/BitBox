<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://kit.fontawesome.com/aaaf80a071.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--This is header section-->
    <header>
        <nav>
            <a href="index.html"><img src="images/logo.jpeg" alt="logo" width="150px"></a>
            <ul>
                <li><a href="home.html" class="active">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="bite deals.html">Bite Deals</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-arrow-down"></i></a></li>
                <li><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i>Login</a></li>
            </ul>
        </nav>
    </header>
    <!--end of header section-->

    <!--Start of authentication section-->
    <section class="auth-container">
        <div class="auth-box">
            <h2>Login to Bite<span>Box</span></h2>
            <form>
                <input type="email" placeholder="Enter Email" id="email" required>
                <div style="position:relative;">
                    <input type="password" placeholder="Enter Password" id="password" required>
                    <span onclick="togglePassword()"
                        style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor: pointer;">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
                <button type="submit" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
                <p id="error" style="color:red;"></p>
                <p><a href="signup.html"><i class="fa-solid fa-key"></i> Forget Password</a></p>
                <p>Dont have an account? <a href="signup.html"><i class="fa-solid fa-user-plus"></i> SignUp</a></p>
            </form>
        </div>
    </section>
    <!--End of authentication section-->
    <script src="js/script.js"></script>
</body>

</html>
