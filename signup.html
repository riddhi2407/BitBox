<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <script src="https://kit.fontawesome.com/aaaf80a071.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--This is header section-->
    <header>
        <nav>
            <img src="images/logo.jpeg" alt="logo" width="150px">
            <ul>
                <li><a href="home.html" class="active">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="bite deals.html">Bite Deals</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-arrow-down"></i></a></li>
                <li><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i>Login</a></li>
            </ul>
        </nav>
    </header>
    <!--end of header section-->

    <!--start authentication section-->
    <section class="auth-container">
        <div class="auth-box">
            <h2>Create Account</h2>
            <form>
                <input type="text" placeholder="Full name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="confirm password" placeholder="Confirm password" required>

                <button type="submit">SingUp</button>
            </form>
            <p>Already have an account?<a href="login.html">Login</a></p>
        </div>
    </section>
    <!--end authentication section-->


</body>

</html>
